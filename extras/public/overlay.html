    body { background: transparent !important; overflow: hidden; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    .main-container { display: flex; height: 98vh; flex-direction: column; justify-content: flex-end; padding-left: 10px; padding-bottom: 10px; width: 100%; }
    .message-row { position: relative; flex: 0 0 auto; width: fit-content; max-width: 380px; word-wrap: break-word; word-break: break-word; padding-bottom: 15px; padding-top: 15px; padding-left: 55px; padding-right: 15px; }
    .anim { opacity: 0; animation: fadeIn 0.5s linear 0.1s forwards; }
    .msgcont { width: 100%; position: relative; z-index: 1; transform-origin: left top; }
    .mainiconcont { position: absolute; width: 50px; height: 50px; background: var(--mainiconbg); border-radius: 15px; z-index: 50; top: 15px; left: -5px; box-shadow: 0 4px 12px var(--bordercolor); display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid rgba(255,255,255,0.2); }
    .cathead { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; object-fit: cover; border-radius: 50%; }
    .messagebox { padding: 10px 14px 10px 14px; border-radius: 16px; background: var(--msgcol); box-shadow: -4px 4px 0 var(--bordercolor), 0 8px 20px rgba(0,0,0,0.4); color: var(--textcolor); width: 100%; position: relative; z-index: 2; font-size: 13px; line-height: 1.5; margin-left: 50px; backdrop-filter: blur(10px); }
    .namebox { color: var(--namescolor); margin-bottom: 2px; width: fit-content; display: inline-flex; font-size: 13px; font-weight: 800; align-items: center; gap: 6px; }
    .name { position: relative; margin-right: 5px; }
    .message { word-wrap: break-word; width: 100%; position: relative; line-height: 1.4em; display: block; z-index: 50; font-weight: 500; opacity: 0; animation: fadeIn 0.4s linear 0.3s forwards; font-size: 13px; }
    .flag { position: absolute; top: 2px; right: 5px; font-size: 14px; }
    .fadeOut { animation: fadeOut 0.5s ease forwards; }
    @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

    .gift-icon {
      width: 26px;
      height: 26px;
      object-fit: contain;
      vertical-align: middle;
      margin-right: 6px;
      margin-top: -2px;
      filter: drop-shadow(0 0 6px rgba(255, 105, 180, 0.6));
      animation: giftPulse 1.5s ease-in-out infinite;
    }
    @keyframes giftPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .messagebox::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 4px;
      border-radius: 4px 0 0 4px;
      background: var(--platform-color, transparent);
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-right: 5px;
      vertical-align: middle;
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.5;

    .platform-badge.tiktok  { background: rgba(255, 0, 80, 0.22);    color: #ff8fab; border: 1px solid rgba(255, 0, 80, 0.5); }
    .platform-badge.kick    { background: rgba(83, 252, 24, 0.15);   color: #8eff70; border: 1px solid rgba(83, 252, 24, 0.4); }
    .platform-badge.youtube { background: rgba(255, 0, 0, 0.2);      color: #ff8a8a; border: 1px solid rgba(255, 0, 0, 0.45); }

    .message-row.twitch .namebox { color: #a78bfa; }

    .message-row.tiktok .namebox { color: #f472b6; }

    .message-row.kick .messagebox { box-shadow: -4px 4px 0 #53fc18, 0 8px 20px rgba(0,0,0,0.4); --platform-color: #53fc18; }

    .message-row.youtube .messagebox { box-shadow: -4px 4px 0 #ff0000, 0 8px 20px rgba(0,0,0,0.4); --platform-color: #ff0000; }
    .message-row.youtube .namebox { color: #ff5252; }

    .message-row.alert .messagebox {
      background: linear-gradient(135deg, rgba(255, 105, 180, 0.25), rgba(0, 229, 255, 0.25));

      box-shadow: -4px 4px 0 #ff69b4, 0 0 25px rgba(255, 105, 180, 0.6);
    }
    .message-row.alert .message { font-weight: 700; }
  </style>
</head>

      function normalizarNombreRegalo(nombre) {
        return String(nombre || '')
          .toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .replace(/\s+/g, '-')
          .replace(/[^a-z0-9\-_]/g, '')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '');
      }

      async function cargarMapaGiftsOverlay() {
        try {
          const response = await fetch(`${window.SERVER_BASE}/api/gift-images-map`);
          giftImagesMapGlobal = await response.json();
          const total = Object.keys(giftImagesMapGlobal).length;
          console.log(`🎁 Mapa de regalos cargado en overlay: ${total} imágenes`);
        } catch (e) {
          console.warn('❌ No se pudo cargar el mapa de regalos:', e.message);
        }
      }
      cargarMapaGiftsOverlay();

      function getUrlImagenRegalo(nombre) {
        if (!nombre) return null;
        const clave = normalizarNombreRegalo(nombre);
        if (!clave) return null;
        let url = giftImagesMapGlobal[clave];
        if (!url) return null;
        if (/^https?:\/\//i.test(url)) return url;
        if (!url.startsWith('/')) url = '/' + url;
        const partes = url.split('/').map((p, i) => {
          if (i === 0) return p;
          return p.includes('%') ? p : encodeURIComponent(p);
        });
        return `${window.SERVER_BASE}${partes.join('/')}`;
      }

        'here','there','where','when','why','how','who','what','which','whose',
        'one','two','three','four','five','six','seven','eight','nine','ten','hundred','thousand'
      ]);

      function cleanText(text) {
        if (!text) return '';
        return String(text)
          .replace(/[\u{1F300}-\u{1FAFF}]/gu, '')
          .replace(/[\u{2600}-\u{27BF}]/gu, '')
          .replace(/[\u{1F000}-\u{1F02F}]/gu, '')
          .replace(/[\u{1F0A0}-\u{1F0FF}]/gu, '')
          .replace(/[\u{1F100}-\u{1F1FF}]/gu, '')
          .replace(/[\u{1F200}-\u{1F2FF}]/gu, '')
          .replace(/[\u{1F600}-\u{1F64F}]/gu, '')
          .replace(/[\u{1F680}-\u{1F6FF}]/gu, '')
          .replace(/[\u{1F700}-\u{1F77F}]/gu, '')
          .replace(/[\u{1F780}-\u{1F7FF}]/gu, '')
          .replace(/[\u{1F800}-\u{1F8FF}]/gu, '')
          .replace(/[\u{1F900}-\u{1F9FF}]/gu, '')
          .replace(/[\u{1FA00}-\u{1FAFF}]/gu, '')
          .replace(/[\u{200D}]/gu, '')
          .replace(/[\u{FE0F}]/gu, '')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function detectLanguage(text) {
        if (!text) return 'es';
        const cleaned = cleanText(text);

        if (cleaned.length < 3) return 'es';
        if (/^[\d\s.,!?¿¡\-_()\[\]{}]+$/.test(cleaned)) return 'es';

        if (/[\u3040-\u30FF]/.test(cleaned)) return 'ja';
        if (/[\u4E00-\u9FFF\u3400-\u4DBF]/.test(cleaned)) return 'zh-CN';
        if (/[\uAC00-\uD7AF]/.test(cleaned)) return 'ko';
        if (/[\u0600-\u06FF\u0750-\u077F]/.test(cleaned)) return 'ar';
        if (/[\u0400-\u04FF]/.test(cleaned)) return 'ru';
        if (/[\u0E00-\u0E7F]/.test(cleaned)) return 'th';
        if (/[\u0900-\u097F]/.test(cleaned)) return 'hi';
        if (/[\u0590-\u05FF]/.test(cleaned)) return 'he';
        if (/[\u0370-\u03FF]/.test(cleaned)) return 'el';

        if (/[ñÑ¿¡]/.test(cleaned)) return 'es';

        const spanishHint = /\b(se|al|del|el|la|los|las|un|una|unos|unas|y|o|que|qué|es|son|está|están|fue|fui|será|hola|gracias|amigo|amiga|hermano|hermana|corazón|amor|vida|porque|pero|también|muy|más|menos|aquí|allí|así|ahora|después|antes|siempre|nunca|cuando|dónde|cómo|quién|quiénes|directo|en vivo|seguidor|seguidores|regalo|regalos|se unió|se sumó|seguir)\b/i;
        if (spanishHint.test(cleaned)) return 'es';

        if (/[äöüßÄÖÜ]/.test(cleaned)) return 'de';
        if (/[àâäéèêëïîôöùûüÿçœæ]/.test(cleaned) && !/[äöüß]/.test(cleaned)) return 'fr';
        if (/\b(che|come|dove|quando|perché|perche|sono|siamo|siete|abbiamo|questo|questa|molto|anche|però|ancora|sempre|mai|oggi|domani|ieri)\b/i.test(cleaned)) return 'it';
        if (/[ãõáéíóúâêôç]/.test(cleaned) && !/[ñ]/.test(cleaned)) return 'pt';
        if (/[áéíóúü]/.test(cleaned)) return 'es';

        const words = cleaned.toLowerCase().split(/\s+/).filter(w => w.length > 1);
        if (words.length === 0) return 'es';

        let spanishCount = 0, englishCount = 0;
        for (const w of words) {
          const wClean = w.replace(/[.,!?¿¡"'()\[\]]/g, '');
          if (SPANISH_WORDS.has(wClean)) spanishCount++;
          if (ENGLISH_WORDS.has(wClean)) englishCount++;
        }

        if (spanishCount > englishCount) return 'es';
        if (englishCount > spanishCount) return 'en';
        if (/^[a-záéíóúüñ\s]+$/i.test(cleaned)) return 'en';
        return 'es';
      }

      const PROTECTED_WORDS = [
        'directo', 'en vivo', 'vivo', 'se unió', 'se sumó', 'seguidor', 'seguidores', 'regalo', 'regalos', 'suscripción', 'suscriptor',
        'live', 'stream', 'streamer', 'streamers', 'streaming',
        'chat', 'clip', 'clips', 'vlog', 'vlogs',
        'follow', 'follows', 'follower', 'followers',
        'sub', 'subs', 'subscriber', 'subscribers',
        'donation', 'donations', 'donate', 'donated',
        'raid', 'raids', 'hype',
        'host', 'hosting', 'viewer', 'viewers',
        'tiktok', 'twitch', 'youtube', 'kick', 'obs', 'discord', 'twitter', 'instagram',
        'togi', 'togipanel',
        'gg', 'wp', 'ez', 'ff', 'afk', 'pog', 'poggers', 'kappa', 'pepega',
        'lol', 'lmao', 'rofl', 'omg', 'wtf', 'btw', 'imo', 'tbh', 'idk', 'ttyl', 'brb', 'gtg',
        'ok', 'okay', 'okey', 'yes', 'maybe'
      ];

      function protectWords(text) {
        if (!text) return { text, tokens: [] };
        const tokens = [];
        let result = text;

        for (const word of PROTECTED_WORDS) {
          const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(`\\b${escaped}\\b`, 'gi');
          result = result.replace(regex, (match) => {
            const token = `ZzQq${tokens.length}QqZz`;
            tokens.push({ token, original: match });
            return token;
          });
        }

        return { text: result, tokens };
      }

      function unprotectWords(text, tokens) {
        if (!text || !tokens || tokens.length === 0) return text;
        let result = text;
        for (const { token, original } of tokens) {
          result = result.split(token).join(original);
        }
        return result;
      }

      const translationCache = new Map();

      function translateWithMyMemory(text, sourceLang) {
        return new Promise((resolve) => {
          const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|es`;
          const xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.timeout = 4000;
          xhr.onload = function() {
            try {
              if (xhr.status === 200) {
                const data = JSON.parse(xhr.responseText);
                const translated = data.responseData?.translatedText || '';
                if (translated && !/^(please|quota|you used all|invalid)/i.test(translated)) {
                  return resolve({ ok: true, text: translated });
                }
              }
              resolve({ ok: false });
            } catch (e) { resolve({ ok: false }); }
          };
          xhr.onerror = () => resolve({ ok: false });
          xhr.ontimeout = () => resolve({ ok: false });
          xhr.send();
        });
      }

      function translateWithGoogle(text, sourceLang) {
        return new Promise((resolve) => {
          const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=es&dt=t&q=${encodeURIComponent(text)}`;
          const xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.timeout = 4000;
          xhr.onload = function() {
            try {
              if (xhr.status === 200) {
                const data = JSON.parse(xhr.responseText);
                if (Array.isArray(data) && Array.isArray(data[0])) {
                  const translated = data[0].map(seg => seg[0]).filter(Boolean).join('');
                  if (translated) return resolve({ ok: true, text: translated });
                }
              }
              resolve({ ok: false });
            } catch (e) { resolve({ ok: false }); }
          };
          xhr.onerror = () => resolve({ ok: false });
          xhr.ontimeout = () => resolve({ ok: false });
          xhr.send();
        });
      }

      async function translateText(text, targetLang = 'es') {
        if (!text || text.trim().length === 0) return { translated: text, sourceLang: 'es', translated_ok: false };

        const cleanText = text.trim();
        const sourceLang = detectLanguage(cleanText);

        console.log(`🌐 [Detección] "${cleanText.slice(0, 60)}${cleanText.length > 60 ? '…' : ''}" → ${sourceLang}`);

        if (sourceLang === 'es') {
          return { translated: cleanText, sourceLang: 'es', translated_ok: false };
        }

        const cacheKey = `${cleanText}|${sourceLang}|${targetLang}`;
        if (translationCache.has(cacheKey)) {
          return { translated: translationCache.get(cacheKey), sourceLang, translated_ok: true };
        }

        const { text: protectedText, tokens } = protectWords(cleanText);

        let result = await translateWithMyMemory(protectedText, sourceLang);

        if (!result.ok) {
          console.log(`🌐 [Fallback] MyMemory falló, usando Google para "${cleanText.slice(0, 40)}…"`);
          result = await translateWithGoogle(protectedText, sourceLang);
        }

        if (result.ok && result.text) {
          const finalText = unprotectWords(result.text, tokens);
          translationCache.set(cacheKey, finalText);
          return { translated: finalText, sourceLang, translated_ok: true };
        }

        console.warn(`🌐 [Error] No se pudo traducir: "${cleanText.slice(0, 40)}…"`);
        return { translated: cleanText, sourceLang, translated_ok: false };
      }

      function addMessage(data) {
        const platform = (data.platform || 'twitch').toLowerCase();
        const messageText = data.message || '';
        const tipo = (data.type || 'chat').toLowerCase();

        const esRegalo = (tipo === 'gift') || !!data.giftName;

        const alertKeywords = ['🎁', '❤️', '💎', '⭐', '🚀', '💗', '🌹', '👥', '🔗', '💫', '🎉', '🌟', '🎮'];
        const isAlert = alertKeywords.some(kw => messageText.includes(kw));

        let urlImagenRegalo = null;
        if (esRegalo && data.giftName) {
          urlImagenRegalo = getUrlImagenRegalo(data.giftName);
        }

        const messageRow = document.createElement('div');
        messageRow.className = `message-row ${platform}${isAlert ? ' alert' : ''}`;

        const anim = document.createElement('div');
        anim.className = 'anim';
        const msgcont = document.createElement('div');
        msgcont.className = 'msgcont';
        const mainiconcont = document.createElement('div');
        mainiconcont.className = 'mainiconcont';
        const cathead = document.createElement('img');
        cathead.className = 'cathead';
        cathead.src = data.avatar || DEFAULT_AVATAR;
        cathead.alt = 'avatar';
        cathead.onerror = function() { this.src = DEFAULT_AVATAR; };

        mainiconcont.appendChild(cathead);
        msgcont.appendChild(mainiconcont);

        const messagebox = document.createElement('div');
        messagebox.className = 'messagebox';
        const flagSpan = document.createElement('span');
        flagSpan.className = 'flag';
        const namebox = document.createElement('div');
        namebox.className = 'namebox';

        const meta = PLATFORM_META[platform];
        if (meta) {
          const badge = document.createElement('span');
          badge.className = `platform-badge ${platform}`;
          badge.innerHTML = `<i class="${meta.icon}"></i>${meta.label}`;
          namebox.appendChild(badge);
        }

        if (urlImagenRegalo) {
          const imgGift = document.createElement('img');
          imgGift.className = 'gift-icon';
          imgGift.src = urlImagenRegalo;
          imgGift.alt = data.giftName || 'regalo';
          imgGift.onerror = function() {
            this.replaceWith(document.createTextNode('🎁 '));
          };
          namebox.appendChild(imgGift);
        }

        const nameSpan = document.createElement('span');
        nameSpan.className = 'name';
        nameSpan.textContent = data.username || 'Anónimo';
        namebox.appendChild(nameSpan);

        const messageSpan = document.createElement('span');
        messageSpan.className = 'message';
        messagebox.appendChild(namebox);
        messagebox.appendChild(messageSpan);
        msgcont.appendChild(messagebox);
        anim.appendChild(msgcont);
        messageRow.appendChild(anim);
        chatContainer.appendChild(messageRow);

        const cleanForCheck = cleanText(messageText);
        const isEmptyAfterClean = !cleanForCheck || cleanForCheck.length < 2;

        if (isEmptyAfterClean) {
          messageSpan.textContent = messageText;
        } else {
          translateText(messageText).then(result => {
            let finalText = result.translated;

            if (censorshipEnabled && !isAlert && !esRegalo) {
              finalText = applyGenderReplacements(finalText);
            }

            if (result.translated_ok && result.sourceLang !== 'es') {
              flagSpan.textContent = getFlagByLang(result.sourceLang);
              messagebox.appendChild(flagSpan);
            }

            messageSpan.textContent = finalText;
          }).catch(() => {
            messageSpan.textContent = messageText;
          });
        }

        while (chatContainer.children.length > MAX_MESSAGES) {
          chatContainer.firstChild.remove();
        }

        setTimeout(() => {
          messageRow.classList.add('fadeOut');
          setTimeout(() => messageRow.remove(), 500);
        }, MESSAGE_LIFETIME);
      }

      mainSocket.on('chat-message', (data) => {
        if (!data || !data.username) return;
        addMessage(data);
      });

      mainSocket.on('connect', () => {
        console.log("✅ Overlay conectado exitosamente con server.js");
      });

      mainSocket.on('disconnect', () => {
        console.log("❌ Overlay desconectado del servidor");
      });
    })();
  </script>
