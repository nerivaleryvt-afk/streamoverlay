<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hype Train — TogiPanel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700;800&family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VARIABLES BASE Y TEMAS
   ============================================================ */
:root {
  --font-body: 'Inter', system-ui, sans-serif;
  --font-title: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --panel-radius: 20px;
  --panel-clip: none;
  --panel-border: 2px;
  --panel-border-style: solid;

  --transition-theme: 0.6s ease;
}

[data-theme="cyberpunk"] {
  --primary: #ff00ff;
  --secondary: #00ffff;
  --accent: #ffff00;
  --bg-1: rgba(10, 0, 20, 0.95);
  --bg-2: rgba(30, 0, 50, 0.95);
  --text: #ffffff;
  --text-dim: rgba(255, 255, 255, 0.7);
  --border: var(--primary);
  --glow: 0 0 30px var(--primary), 0 0 60px rgba(255, 0, 255, 0.3);
  --glow-strong: 0 0 50px var(--primary), 0 0 100px var(--secondary);
  --progress-gradient: linear-gradient(90deg, var(--primary), var(--secondary));
  --font-title: 'JetBrains Mono', monospace;
  --panel-radius: 0;
  --panel-clip: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
}

[data-theme="cristal"] {
  --primary: #b07cff;
  --secondary: #ff7cd4;
  --accent: #7cd4ff;
  --bg-1: rgba(20, 10, 40, 0.75);
  --bg-2: rgba(50, 20, 80, 0.75);
  --text: #ffffff;
  --text-dim: rgba(255, 255, 255, 0.75);
  --border: rgba(180, 120, 255, 0.6);
  --glow: 0 0 40px rgba(150, 80, 255, 0.5), inset 0 0 30px rgba(120, 60, 255, 0.15);
  --glow-strong: 0 0 80px rgba(255, 120, 220, 0.9), 0 0 120px rgba(180, 120, 255, 0.6);
  --progress-gradient: linear-gradient(90deg, #7c4dff, #b07cff, #ff7cd4);
  --panel-radius: 24px;
  --panel-clip: none;
}

[data-theme="minimal"] {
  --primary: #ffffff;
  --secondary: #a0a0a0;
  --accent: #ff6b6b;
  --bg-1: rgba(0, 0, 0, 0.85);
  --bg-2: rgba(20, 20, 20, 0.85);
  --text: #ffffff;
  --text-dim: rgba(255, 255, 255, 0.6);
  --border: rgba(255, 255, 255, 0.15);
  --glow: 0 8px 40px rgba(0, 0, 0, 0.6);
  --glow-strong: 0 8px 60px rgba(0, 0, 0, 0.8);
  --progress-gradient: linear-gradient(90deg, #ffffff, #a0a0a0);
  --panel-radius: 12px;
  --panel-clip: none;
}

[data-theme="tiktok"] {
  --primary: #ff0050;
  --secondary: #00f2ea;
  --accent: #ffffff;
  --bg-1: rgba(15, 0, 10, 0.92);
  --bg-2: rgba(30, 0, 20, 0.92);
  --text: #ffffff;
  --text-dim: rgba(255, 255, 255, 0.75);
  --border: rgba(255, 0, 80, 0.6);
  --glow: 0 0 30px rgba(255, 0, 80, 0.5), 0 0 60px rgba(0, 242, 234, 0.3);
  --glow-strong: 0 0 60px rgba(255, 0, 80, 0.9), 0 0 100px rgba(0, 242, 234, 0.6);
  --progress-gradient: linear-gradient(90deg, #ff0050, #00f2ea);
  --font-title: 'Poppins', sans-serif;
  --panel-radius: 28px;
  --panel-clip: none;
}

/* ============================================================
   RESET Y BASE
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: var(--font-body);
  color: var(--text);
  transition: color var(--transition-theme);
}

body {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 40px;
}

/* ============================================================
   PARTÍCULAS DE FONDO
   ============================================================ */
.particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 10px var(--primary);
  opacity: 0.5;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* ============================================================
   PANEL PRINCIPAL
   ============================================================ */
.hype-train {
  position: relative;
  z-index: 2;
  width: 900px;
  max-width: 95vw;
  background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
  border: var(--panel-border) var(--panel-border-style) var(--border);
  border-radius: var(--panel-radius);
  clip-path: var(--panel-clip);
  padding: 22px 30px;
  box-shadow: var(--glow);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition:
    box-shadow var(--transition-theme),
    border-color var(--transition-theme),
    background var(--transition-theme),
    border-radius var(--transition-theme),
    clip-path var(--transition-theme);
  opacity: 0;
  transform: translateY(50px);
  overflow: hidden;
}

.hype-train.active {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}

[data-theme="cyberpunk"] .hype-train::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 3px,
    rgba(255, 0, 255, 0.04) 3px,
    rgba(255, 0, 255, 0.04) 4px
  );
  pointer-events: none;
  animation: scan 8s linear infinite;
}
@keyframes scan {
  0% { transform: translateY(0); }
  100% { transform: translateY(4px); }
}

.hype-train::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
  animation: sweep 4s infinite;
  pointer-events: none;
}
@keyframes sweep {
  0% { left: -100%; }
  100% { left: 100%; }
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  position: relative;
  z-index: 2;
  gap: 12px;
}

.title-block {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.title {
  font-family: var(--font-title);
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  background: var(--progress-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px var(--primary));
  white-space: nowrap;
}

.rank {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  transition: color 0.4s;
}

.timer-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.timer {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 12px var(--accent);
  transition: color 0.3s, text-shadow 0.3s;
  white-space: nowrap;
}

.timer.urgent {
  color: #ff4d4d;
  text-shadow: 0 0 16px #ff4d4d;
  animation: blink 0.6s infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

.timer.bonus {
  animation: timerBonus 0.8s ease;
}
@keyframes timerBonus {
  0% { transform: scale(1); color: var(--accent); }
  30% { transform: scale(1.4); color: #4dff88; text-shadow: 0 0 24px #4dff88; }
  100% { transform: scale(1); color: var(--accent); }
}

/* Barra de tiempo */
.time-bar-wrap {
  width: 100px;
  height: 5px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.time-bar {
  height: 100%;
  width: 100%;
  background: var(--accent);
  border-radius: 3px;
  box-shadow: 0 0 10px var(--accent);
  transition: width 0.3s linear, background 0.3s;
}
.time-bar.urgent {
  background: #ff4d4d;
  box-shadow: 0 0 12px #ff4d4d;
  animation: pulseBar 0.6s infinite;
}
@keyframes pulseBar {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Texto flotante de bonus (+5:00) */
.time-bonus {
  position: absolute;
  top: -22px;
  right: 0;
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 800;
  color: #4dff88;
  text-shadow: 0 0 12px #4dff88;
  pointer-events: none;
  animation: floatBonus 1.5s ease-out forwards;
  white-space: nowrap;
}
@keyframes floatBonus {
  0% { opacity: 0; transform: translateY(0) scale(0.8); }
  30% { opacity: 1; transform: translateY(-10px) scale(1.2); }
  100% { opacity: 0; transform: translateY(-40px) scale(0.9); }
}

/* ============================================================
   BARRA DE PROGRESO (doble capa)
   ============================================================ */
.progress-wrap {
  position: relative;
  height: 32px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 20px;
  border: 1px solid var(--border);
  z-index: 2;
  transition: border-color var(--transition-theme);
}

.progress-trail {
  position: absolute;
  inset: 0;
  width: 0%;
  background: var(--progress-gradient);
  opacity: 0.35;
  filter: blur(6px);
  transition: width 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.progress-bar {
  position: relative;
  height: 100%;
  width: 0%;
  background: var(--progress-gradient);
  border-radius: 16px;
  transition: width 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 25px var(--primary);
  overflow: hidden;
}

.progress-bar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
  animation: shine 1.8s infinite;
}
@keyframes shine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.progress-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
  z-index: 3;
  letter-spacing: 1.5px;
  white-space: nowrap;
}

/* ============================================================
   VÍA + TREN
   ============================================================ */
.track {
  position: relative;
  height: 60px;
  margin-bottom: 16px;
  z-index: 2;
  overflow: hidden;
}

.track::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: 8px;
  height: 3px;
  background: repeating-linear-gradient(
    90deg,
    var(--border) 0px,
    var(--border) 18px,
    transparent 18px,
    transparent 28px
  );
  box-shadow: 0 0 15px var(--primary);
  animation: railMove 1.5s linear infinite;
  transition: background var(--transition-theme);
}
@keyframes railMove {
  0% { background-position: 0 0; }
  100% { background-position: -28px 0; }
}

.train {
  position: absolute;
  bottom: 0;
  left: 0;
  display: flex;
  align-items: flex-end;
  gap: 6px;
  font-size: 42px;
  line-height: 1;
  transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 0 12px var(--primary));
}

.wagon {
  display: inline-block;
  animation: chug 0.5s infinite alternate;
  transition: opacity 0.5s, filter 0.5s, transform 0.5s;
}
.wagon:nth-child(2) { animation-delay: 0.1s; }
.wagon:nth-child(3) { animation-delay: 0.2s; }
.wagon:nth-child(4) { animation-delay: 0.3s; }
.wagon:nth-child(5) { animation-delay: 0.4s; }
.wagon:nth-child(6) { animation-delay: 0.5s; }
.wagon:nth-child(7) { animation-delay: 0.6s; }
.wagon:nth-child(8) { animation-delay: 0.7s; }
@keyframes chug {
  0% { transform: translateY(0); }
  100% { transform: translateY(-5px); }
}

.wagon.counter {
  font-size: 22px;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--accent);
  align-self: center;
  animation: none;
  text-shadow: 0 0 10px var(--accent);
}

.wagon.unlocking {
  animation: unlock 0.9s ease;
}
@keyframes unlock {
  0% { transform: scale(1); filter: grayscale(1) brightness(1); }
  40% { transform: scale(1.7); filter: grayscale(0) brightness(2.5); }
  100% { transform: scale(1); filter: grayscale(0) brightness(1); }
}

.smoke {
  position: absolute;
  bottom: 40px;
  left: 8px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.4);
  filter: blur(4px);
  animation: smokeRise 2.5s infinite;
  pointer-events: none;
}
@keyframes smokeRise {
  0% { transform: translate(0, 0) scale(0.5); opacity: 0.6; }
  50% { transform: translate(-15px, -30px) scale(1.3); opacity: 0.3; }
  100% { transform: translate(-30px, -60px) scale(2); opacity: 0; }
}

/* ============================================================
   FOOTER (stats + top 3)
   ============================================================ */
.footer {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 20px;
  position: relative;
  z-index: 2;
  transition: grid-template-columns var(--transition-theme);
}

.stats {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 14px;
  color: var(--text-dim);
}

.stat {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.stat .num {
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--accent);
  font-size: 16px;
  display: inline-block;
  transition: transform 0.3s;
}
.stat .num.pop {
  transform: scale(1.5);
  color: #fff;
}

.top3 {
  display: flex;
  gap: 14px;
  align-items: center;
  font-size: 13px;
}

.top-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  transition: background 0.3s, transform 0.3s;
  white-space: nowrap;
}

.top-item .medal { font-size: 14px; }
.top-item .name {
  font-weight: 700;
  color: var(--text);
  max-width: 90px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.top-item .pts {
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--accent);
  font-size: 12px;
}

.top-item.p1 { border-color: #ffd700; box-shadow: 0 0 12px rgba(255, 215, 0, 0.4); }
.top-item.p2 { border-color: #c0c0c0; }
.top-item.p3 { border-color: #cd7f32; }

/* ============================================================
   EFECTOS DE HITO Y SALVACIÓN
   ============================================================ */
.flash {
  position: fixed;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 999;
}
.flash.fire {
  animation: flashFire 0.4s ease;
}
@keyframes flashFire {
  0% { opacity: 0; }
  30% { opacity: 0.7; }
  100% { opacity: 0; }
}
.flash.gold {
  background: #ffd700;
}
.flash.gold.fire {
  animation: flashGold 0.6s ease;
}
@keyframes flashGold {
  0% { opacity: 0; }
  25% { opacity: 0.85; }
  100% { opacity: 0; }
}

.hype-train.shake {
  animation: shake 0.4s ease;
}
@keyframes shake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-4px, 2px); }
  40% { transform: translate(4px, -2px); }
  60% { transform: translate(-3px, -2px); }
  80% { transform: translate(3px, 2px); }
}

.hype-train.level-up {
  animation: levelPulse 0.9s ease;
}
@keyframes levelPulse {
  0% { box-shadow: var(--glow); }
  50% { box-shadow: var(--glow-strong); transform: scale(1.02); }
  100% { box-shadow: var(--glow); transform: scale(1); }
}

.hype-train.saved {
  animation: savedPulse 1.2s ease;
}
@keyframes savedPulse {
  0% { box-shadow: var(--glow); }
  30% { box-shadow: 0 0 80px #ffd700, 0 0 160px #ffd700, inset 0 0 60px rgba(255, 215, 0, 0.5); transform: scale(1.04); }
  60% { box-shadow: 0 0 60px #ffd700, 0 0 120px #ffd700; transform: scale(1.02); }
  100% { box-shadow: var(--glow); transform: scale(1); }
}

.floating-level {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-title);
  font-size: 64px;
  font-weight: 900;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #fff;
  text-shadow:
    0 0 30px var(--primary),
    0 0 60px var(--secondary),
    0 0 90px var(--accent);
  pointer-events: none;
  opacity: 0;
  z-index: 1000;
  white-space: nowrap;
  text-align: center;
}
.floating-level.show {
  animation: floatUp 1.4s ease-out forwards;
}
.floating-level.saved-text {
  color: #ffd700;
  text-shadow:
    0 0 30px #ffd700,
    0 0 60px #ffaa00,
    0 0 90px #ffd700;
  font-size: 72px;
}
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
  25% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
  70% { opacity: 1; transform: translate(-50%, -80%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -150%) scale(0.8); }
}

.confetti-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 998;
  overflow: hidden;
}
.confetti-piece {
  position: absolute;
  width: 10px;
  height: 10px;
  top: 50%;
  left: 50%;
  border-radius: 2px;
}

/* ============================================================
   RESPONSIVE — MODO VERTICAL (TikTok Live)
   ============================================================ */
@media (max-aspect-ratio: 1/1) {
  body {
    padding: 20px;
    align-items: center;
  }

  .hype-train {
    width: 100%;
    max-width: 100%;
    padding: 20px 22px;
  }

  .header {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 14px;
  }

  .title { font-size: 20px; letter-spacing: 1px; }
  .rank { font-size: 11px; letter-spacing: 1.5px; }

  .timer-wrap {
    align-items: flex-start;
    align-self: stretch;
    margin-top: -34px;
    align-items: flex-end;
  }
  .timer { font-size: 18px; }
  .time-bar-wrap { width: 80px; }

  .progress-wrap { height: 26px; margin-bottom: 16px; }
  .progress-label { font-size: 12px; }

  .track { height: 50px; }
  .train { font-size: 34px; }
  .wagon.counter { font-size: 18px; }

  .footer {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .stats {
    gap: 12px;
    font-size: 13px;
  }
  .stat .num { font-size: 15px; }

  .top3 {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }

  .top-item {
    justify-content: space-between;
    padding: 6px 12px;
  }
  .top-item .name { max-width: none; }

  .floating-level { font-size: 44px; }
  .floating-level.saved-text { font-size: 50px; }
}

body.reduced .particle,
body.reduced .smoke,
body.reduced .hype-train::after {
  display: none;
}
body.reduced .hype-train,
body.reduced .progress-bar,
body.reduced .train {
  animation: none !important;
  transition-duration: 0.2s !important;
}

/* ============================================================
   CONTROLES DE DEMO
   ============================================================ */
.demo-controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 95vw;
  padding: 14px 18px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 14px;
  backdrop-filter: blur(12px);
  z-index: 100;
  font-family: var(--font-body);
}
.demo-controls.hidden { display: none; }

.demo-controls button {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: linear-gradient(135deg, #7c4dff, #b07cff);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
.demo-controls button:hover {
  transform: translateY(-2px);

<script src="/socket.io/socket.io.js" onerror="window.__noSocket = true"></script>
<script>
/* ============================================================
   CONFIGURACIÓN POR DEFECTO
   ============================================================ */
const DEFAULT_CONFIG = {
  theme: 'cyberpunk',
  duration: 300,               // 5 min base
  base: 100,
  factor: 1.4,
  themeChangeEvery: 5,
  maxVisibleWagons: 8,
  milestones: [5, 10, 15, 20, 30, 50],
  titles: [
    { min: 1,  name: 'Pasajero' },
    { min: 5,  name: 'Maquinista' },
    { min: 10, name: 'Capitán' },
    { min: 15, name: 'Comandante' },
    { min: 20, name: 'Leyenda' }
  ],
  gifts: {
    '🌹': 1,
    '🍩': 10,
    '🦁': 50,
    '🚀': 200,
    '👑': 500
  },
  sounds: {
    enabled: true,
    volume: 0.4,
    activation: true,
    gift: true,
    levelUp: true,
    milestone: true,
    sprint: true,
    end: true,
    saved: true
  },
  display: {
    showTop3: true,
    showUniqueGifters: true,
    showRate: true,
    showTitles: true
  },
  timerRules: {
    resetOnLevelUp: true,      // resetear timer al subir de nivel
    bonusOnMilestone: 60,      // +1 min en hitos
    maxBonus: 300,             // máx 5 min de bonus acumulado
    savedThreshold: 15,        // seg para considerar "salvación"
    showBonusText: true
  }
};

let CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));

/* ============================================================
   ESTADO
   ============================================================ */
let state = {
  active: false,
  points: 0,
  level: 0,
  gifts: 0,
  uniqueGifters: new Set(),
  contributors: {},
  endsAt: null,
  startedAt: null,
  theme: CONFIG.theme,
  bonusTime: 0,
  _lastSprintTick: null,
  _wasUrgent: false
};

let timerInterval = null;
let rateInterval = null;

/* ============================================================
   DOM
   ============================================================ */
const el = {
  body: document.body,
  hypeTrain: document.getElementById('hypeTrain'),
  rank: document.getElementById('rank'),
  timer: document.getElementById('timer'),
  timeBar: document.getElementById('timeBar'),
  progressBar: document.getElementById('progressBar'),
  progressTrail: document.getElementById('progressTrail'),
  progressLabel: document.getElementById('progressLabel'),
  train: document.getElementById('train'),
  smoke: document.getElementById('smoke'),
  giftCount: document.getElementById('giftCount'),
  uniqueCount: document.getElementById('uniqueCount'),
  rate: document.getElementById('rate'),
  top3: document.getElementById('top3'),
  flash: document.getElementById('flash'),
  floatingLevel: document.getElementById('floatingLevel'),
  confettiLayer: document.getElementById('confettiLayer'),
  particles: document.getElementById('particles'),
  demoControls: document.getElementById('demoControls')
};

/* ============================================================
   NIVELES INFINITOS
   ============================================================ */
function pointsForLevel(level) {
  if (level <= 0) return 0;
  const { base, factor } = CONFIG;
  return Math.floor(base * (Math.pow(factor, level) - 1) / (factor - 1));
}

function levelForPoints(points) {
  let level = 0;
  while (pointsForLevel(level + 1) <= points) level++;
  return level;
}

function titleForLevel(level) {
  if (!CONFIG.display.showTitles) return '';
  let name = '';
  for (const t of CONFIG.titles) {
    if (level >= t.min) name = t.name;
  }
  return name;
}

/* ============================================================
   TEMAS
   ============================================================ */
const THEME_CYCLE = ['cyberpunk', 'cristal', 'minimal', 'tiktok'];

function themeForLevel(level) {
  if (CONFIG.themeChangeEvery <= 0) return CONFIG.theme;
  if (level <= 0) return CONFIG.theme;
  const idx = Math.floor((level - 1) / CONFIG.themeChangeEvery) % THEME_CYCLE.length;
  return THEME_CYCLE[idx];
}

function applyTheme(theme) {
  if (state.theme === theme) return;
  state.theme = theme;
  el.body.dataset.theme = theme;
}

/* ============================================================
   TIMER
   ============================================================ */
function totalDuration() {
  return CONFIG.duration + state.bonusTime;
}

function resetTimer() {
  state.endsAt = Date.now() + totalDuration() * 1000;
}

function addBonusTime(seconds) {
  state.bonusTime = Math.min(
    state.bonusTime + seconds,
    CONFIG.timerRules.maxBonus
  );
}

function showTimeBonus(seconds, isMilestone = false) {
  if (!CONFIG.timerRules.showBonusText) return;

  // Efecto en el timer
  el.timer.classList.add('bonus');
  setTimeout(() => el.timer.classList.remove('bonus'), 800);

  // Texto flotante
  const bonus = document.createElement('div');
  bonus.className = 'time-bonus';
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  bonus.textContent = '+' + (m > 0 ? m + ':' + String(s).padStart(2, '0') : s + 's');
  if (isMilestone) bonus.style.color = '#ffd700';
  el.timer.parentElement.appendChild(bonus);
  setTimeout(() => bonus.remove(), 1500);
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  el.rank.textContent = titleForLevel(state.level) || '—';

  const prev = pointsForLevel(state.level);
  const next = pointsForLevel(state.level + 1);
  const pct = Math.min(100, ((state.points - prev) / (next - prev)) * 100);

  el.progressBar.style.width = pct + '%';
  el.progressTrail.style.width = pct + '%';
  el.progressLabel.textContent = `NIVEL ${state.level} / ∞`;

  el.giftCount.textContent = state.gifts;
  el.uniqueCount.textContent = state.uniqueGifters.size;

  renderTop3();
  renderTrain();
}

function renderTrain() {
  const visible = Math.min(state.level + 1, CONFIG.maxVisibleWagons);
  const extra = Math.max(0, state.level + 1 - CONFIG.maxVisibleWagons);

  let html = '';
  for (let i = 0; i < visible; i++) {
    const icon = i === 0 ? '🚂' : '🚃';
    html += `<span class="wagon" data-level="${i + 1}">${icon}</span>`;
  }
  if (extra > 0) {
    html += `<span class="wagon counter">+${extra}</span>`;
  }
  el.train.innerHTML = html;

  const maxOffset = 70;
  const offset = Math.min(maxOffset, (state.level / 20) * maxOffset);
  el.train.style.transform = `translateX(${offset}%)`;
}

function renderTop3() {
  if (!CONFIG.display.showTop3) {
    el.top3.innerHTML = '';
    return;
  }

  const sorted = Object.entries(state.contributors)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3);

  if (sorted.length === 0) {
    el.top3.innerHTML = '';
    return;
  }

  const medals = ['🥇', '🥈', '🥉'];
  el.top3.innerHTML = sorted.map(([name, pts], i) => `
    <div class="top-item p${i + 1}">
      <span class="medal">${medals[i]}</span>
      <span class="name">@${escapeHtml(name)}</span>
      <span class="pts">${pts}</span>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* ============================================================
   TIMER LOOP
   ============================================================ */
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(tick, 250);
  tick();
}

function tick() {
  if (!state.active || !state.endsAt) {
    el.timer.textContent = '00:00';
    el.timeBar.style.width = '0%';
    el.timer.classList.remove('urgent');
    el.timeBar.classList.remove('urgent');
    return;
  }

  const remaining = Math.max(0, Math.floor((state.endsAt - Date.now()) / 1000));
  const m = String(Math.floor(remaining / 60)).padStart(2, '0');
  const s = String(remaining % 60).padStart(2, '0');
  el.timer.textContent = `${m}:${s}`;

  // Barra de tiempo
  const total = totalDuration() * 1000;
  const pct = Math.max(0, Math.min(100, (remaining * 1000 / total) * 100));
  el.timeBar.style.width = pct + '%';

  // Urgencia
  const isUrgent = remaining <= CONFIG.timerRules.savedThreshold;
  el.timer.classList.toggle('urgent', isUrgent);
  el.timeBar.classList.toggle('urgent', isUrgent);
  state._wasUrgent = isUrgent;

  // Tic-tac últimos 5s
  if (isUrgent && remaining <= 5 && remaining > 0) {
    if (remaining !== state._lastSprintTick) {
      state._lastSprintTick = remaining;
      if (CONFIG.sounds.sprint) sound.sprint();
    }
  }

  if (remaining === 0) end();
}

/* ============================================================
   RITMO
   ============================================================ */
function updateRate() {
  if (!state.startedAt || !state.active) {
    el.rate.textContent = '0';
    return;
  }
  const mins = (Date.now() - state.startedAt) / 60000;
  const rate = mins > 0.1 ? Math.round(state.points / mins) : 0;
  el.rate.textContent = rate;
}

function startRateInterval() {
  clearInterval(rateInterval);
  rateInterval = setInterval(updateRate, 2000);
  updateRate();
}

/* ============================================================
   ACCIONES
   ============================================================ */
function start(customConfig = {}) {
  CONFIG = { ...JSON.parse(JSON.stringify(DEFAULT_CONFIG)), ...customConfig };
  resetState();
  state.active = true;
  state.startedAt = Date.now();
  state.bonusTime = 0;
  state.theme = CONFIG.theme;

  applyTheme(CONFIG.theme);
  resetTimer();

  el.hypeTrain.classList.add('active');
  sound.init();
  if (CONFIG.sounds.activation) sound.activation();

  render();
  startTimer();
  startRateInterval();
}

function addGift(giftName, points, username) {
  if (!state.active) start();

  if (username) state.uniqueGifters.add(username);
  state.contributors[username] = (state.contributors[username] || 0) + points;
  state.points += points;
  state.gifts += 1;

  el.giftCount.classList.add('pop');
  setTimeout(() => el.giftCount.classList.remove('pop'), 300);

  if (CONFIG.sounds.gift) sound.gift();

  const newLevel = levelForPoints(state.points);
  if (newLevel > state.level) {
    const prevLevel = state.level;
    state.level = newLevel;
    levelUp(newLevel, prevLevel);
  }

  render();
}

function levelUp(newLevel, prevLevel) {
  // Tema
  const targetTheme = themeForLevel(newLevel);
  if (targetTheme !== state.theme) applyTheme(targetTheme);

  // Pulse panel
  el.hypeTrain.classList.add('level-up');
  setTimeout(() => el.hypeTrain.classList.remove('level-up'), 900);

  // Vagón unlocking
  const wagons = el.train.querySelectorAll('.wagon');
  const targetIdx = newLevel - 1;
  if (wagons[targetIdx]) {
    wagons[targetIdx].classList.add('unlocking');
    setTimeout(() => wagons[targetIdx]?.classList.remove('unlocking'), 900);
  }

  // ¿Fue salvación? (estaba en urgent y subió de nivel)
  const wasSaved = state._wasUrgent;

  // Reset del timer
  if (CONFIG.timerRules.resetOnLevelUp) {
    state.bonusTime = 0;  // resetear bonus al subir de nivel
    resetTimer();

    const bonusSecs = CONFIG.duration;
    showTimeBonus(bonusSecs, false);
  }

  // Texto flotante
  if (wasSaved) {
    el.floatingLevel.textContent = '¡SALVADO!';
    el.floatingLevel.classList.add('saved-text');
    el.hypeTrain.classList.add('saved');
    if (CONFIG.sounds.saved) sound.saved();
    setTimeout(() => {
      el.hypeTrain.classList.remove('saved');
      el.floatingLevel.classList.remove('saved-text');
    }, 1200);
  } else {
    el.floatingLevel.textContent = `¡NIVEL ${newLevel}!`;
    el.floatingLevel.classList.remove('saved-text');
    if (CONFIG.sounds.levelUp) sound.levelUp();
  }

  el.floatingLevel.classList.remove('show');
  void el.floatingLevel.offsetWidth;
  el.floatingLevel.classList.add('show');

  // ¿Hito?
  if (CONFIG.milestones.includes(newLevel)) {
    milestone(newLevel);
  }
}

function milestone(level) {
  // Flash
  el.flash.classList.remove('fire', 'gold');
  void el.flash.offsetWidth;
  el.flash.classList.add('gold', 'fire');
  setTimeout(() => el.flash.classList.remove('gold'), 700);

  // Shake
  el.hypeTrain.classList.add('shake');
  setTimeout(() => el.hypeTrain.classList.remove('shake'), 450);

  // Confeti
  spawnConfetti(60);

  // Sonido
  if (CONFIG.sounds.milestone) sound.milestone();

  // Bonus de tiempo extra
  const bonus = CONFIG.timerRules.bonusOnMilestone;
  if (bonus > 0) {
    addBonusTime(bonus);
    resetTimer();
    showTimeBonus(bonus, true);
  }
}

function end() {
  if (!state.active) return;
  state.active = false;
  clearInterval(timerInterval);
  clearInterval(rateInterval);

  if (CONFIG.sounds.end) sound.end();

  el.hypeTrain.classList.remove('active');
  el.timer.classList.remove('urgent');
  el.timeBar.classList.remove('urgent');

  if (window.__socket) {
    window.__socket.emit('hype-train:ended', {
      finalLevel: state.level,
      finalPoints: state.points,
      top3: Object.entries(state.contributors).sort((a,b) => b[1]-a[1]).slice(0,3)
    });
  }
}

function resetState() {
  state.active = false;
  state.points = 0;
  state.level = 0;
  state.gifts = 0;
  state.uniqueGifters = new Set();
  state.contributors = {};
  state.endsAt = null;
  state.startedAt = null;
  state.bonusTime = 0;
  state._lastSprintTick = null;
  state._wasUrgent = false;
}

function reset() {
  end();
  resetState();
  el.timer.textContent = '05:00';
  el.timer.classList.remove('urgent', 'bonus');
  el.timeBar.classList.remove('urgent');
  el.timeBar.style.width = '100%';
  el.hypeTrain.classList.remove('active', 'saved');
  applyTheme(CONFIG.theme);
  render();
}

/* ============================================================
   CONFETI
   ============================================================ */
function spawnConfetti(count = 40) {
  const cs = getComputedStyle(document.body);
  const palette = [
    cs.getPropertyValue('--primary').trim() || '#b07cff',
    cs.getPropertyValue('--secondary').trim() || '#ff7cd4',
    cs.getPropertyValue('--accent').trim() || '#ffd47c',
    '#ffffff'
  ];

  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.background = palette[Math.floor(Math.random() * palette.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.confettiLayer.appendChild(c);

    const angle = Math.random() * Math.PI * 2;
    const dist = 150 + Math.random() * 400;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    const rot = Math.random() * 900 - 450;
    const dur = 1200 + Math.random() * 1000;

    c.animate([
      { transform: 'translate(-50%, -50%) rotate(0deg) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rot}deg) scale(0.6)`, opacity: 0 }
    ], {
      duration: dur,
      easing: 'cubic-bezier(0.15, 0.85, 0.35, 1)'
    }).onfinish = () => c.remove();
  }
}

/* ============================================================
   PARTÍCULAS
   ============================================================ */
function initParticles(count = 25) {
  el.particles.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    const size = 2 + Math.random() * 5;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    el.particles.appendChild(p);
  }
}

/* ============================================================
   AUDIO
   ============================================================ */
const sound = (() => {
  let ctx = null;

  function init() {
    if (!CONFIG.sounds.enabled) return;
    if (ctx) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }

  function playTone(freq, dur, type = 'sine', vol = 0.3, sweepTo = null) {
    if (!ctx || !CONFIG.sounds.enabled) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, ctx.currentTime + dur);
    gain.gain.setValueAtTime(vol * CONFIG.sounds.volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }

  return {
    init,
    activation() {
      playTone(220, 0.25, 'sawtooth', 0.3);
      setTimeout(() => playTone(180, 0.35, 'sawtooth', 0.3), 180);
    },
    gift() { playTone(880, 0.12, 'sine', 0.25); },
    levelUp() { playTone(400, 0.4, 'triangle', 0.3, 1200); },
    milestone() {
      [523, 659, 784, 1047].forEach((f, i) => {
        setTimeout(() => playTone(f, 0.35, 'triangle', 0.3), i * 110);
      });
    },
    sprint() { playTone(1200, 0.06, 'square', 0.15); },
    saved() {
      [659, 784, 988, 1319].forEach((f, i) => {
        setTimeout(() => playTone(f, 0.4, 'triangle', 0.35), i * 100);
      });
    },
    end() {
      playTone(880, 0.6, 'sine', 0.3);
      setTimeout(() => playTone(660, 0.8, 'sine', 0.25), 250);
    }
  };
})();

/* ============================================================
   SOCKET.IO
   ============================================================ */
window.__socket = null;
let socketConnected = false;

if (!window.__noSocket && typeof io !== 'undefined') {
  try {
    const socket = io();
    window.__socket = socket;

    socket.on('connect', () => {
      socketConnected = true;
      el.demoControls.classList.add('hidden');
      socket.emit('hype-train:request-config');
    });

    socket.on('disconnect', () => {
      socketConnected = false;
      el.demoControls.classList.remove('hidden');
    });

    socket.on('hype-train:config', (cfg) => {
      CONFIG = { ...JSON.parse(JSON.stringify(DEFAULT_CONFIG)), ...cfg };
      applyTheme(CONFIG.theme);
      render();
    });

    socket.on('hype-train:start', (data) => {
      start(data?.config || {});
    });

    socket.on('hype-train:update', (data) => {
      if (typeof data.points === 'number') state.points = data.points;
      if (typeof data.gifts === 'number') state.gifts = data.gifts;
      if (Array.isArray(data.uniqueGifters)) state.uniqueGifters = new Set(data.uniqueGifters);
      if (data.contributors) state.contributors = data.contributors;
      if (typeof data.level === 'number') state.level = data.level;
      if (data.endsAt) state.endsAt = data.endsAt;
      if (typeof data.bonusTime === 'number') state.bonusTime = data.bonusTime;
      render();
    });

    socket.on('hype-train:gift', (data) => {
      addGift(data.giftName || '🎁', data.points || 1, data.username || 'anon');
    });

    socket.on('hype-train:end', () => end());

    socket.on('hype-train:config-updated', (cfg) => {
      CONFIG = { ...JSON.parse(JSON.stringify(DEFAULT_CONFIG)), ...cfg };
      applyTheme(CONFIG.theme);
      render();
    });

  } catch (e) {
    console.warn('Socket.io no disponible, modo demo activo');
  }
}

/* ============================================================
   MODO DEMO
   ============================================================ */
const demo = {
  start: () => start(),
  addGift: (gift, pts, user) => addGift(gift, pts, user),
  end: () => end(),
  reset: () => reset(),
  setTheme: (theme) => {
    CONFIG.theme = theme;
    CONFIG.themeChangeEvery = 0;
    applyTheme(theme);
    document.querySelectorAll('[data-theme-btn]').forEach(b => {
      b.classList.toggle('active', b.dataset.themeBtn === theme);
    });
  }
};

if (window.__noSocket || typeof io === 'undefined') {
  el.demoControls.classList.remove('hidden');
  initParticles();
} else {
  setTimeout(() => {
    if (!socketConnected) {
      el.demoControls.classList.remove('hidden');
      initParticles();
    }
  }, 1500);
}

/* Atajos demo */
document.addEventListener('keydown', (e) => {
  if (socketConnected) return;
  if (e.key === ' ') { e.preventDefault(); demo.start(); }
  if (e.key === 'g') demo.addGift('🌹', 10, 'demo');
  if (e.key === 'G') demo.addGift('🚀', 500, 'demo');
  if (e.key === 'r') demo.reset();
});

render();
</script>
</body>
