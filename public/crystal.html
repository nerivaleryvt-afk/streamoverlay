<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crystal Overlay · Premium</title>
<style>
  :root {
    --crystal-core-1:       #ffffff;
    --crystal-core-2:       #c4b5fd;
    --crystal-core-3:       #7c3aed;
    --crystal-fill-top:     rgba(167,139,250,0.35);
    --crystal-fill-bottom:  rgba(124,58,237,0.15);
    --crystal-stroke-1:     #f472b6;
    --crystal-stroke-2:     #a78bfa;
    --crystal-stroke-3:     #7c3aed;
    --crystal-edge:         rgba(255,255,255,0.35);
    --crystal-glow:         rgba(167,139,250,0.55);
    --crystal-glow-size:    60px;
    --crystal-aura-1:       rgba(167,139,250,0.4);
    --crystal-aura-2:       rgba(244,114,182,0.2);
    --particle-1:           #ffffff;
    --particle-2:           #c4b5fd;
    --particle-3:           #a78bfa;
    --particle-glow:        rgba(196,181,253,0.9);
    --gold-1:               #ffffff;
    --gold-2:               #ffd700;
    --gold-3:               #f59e0b;
    --gold-glow:            rgba(255,215,0,1);
    --text-primary:         #ffffff;
    --text-secondary:       #c4b5fd;
    --meta-color:           #a78bfa;
    --label-color:          #c4b5fd;
    --label-glow:           rgba(196,181,253,0.6);
    --topdonor-bg-1:        rgba(30,27,55,0.85);
    --topdonor-bg-2:        rgba(20,20,35,0.85);
    --topdonor-border:      rgba(167,139,250,0.45);
    --topdonor-glow:        rgba(167,139,250,0.4);
    --topdonor-coin-1:      #ffd700;
    --topdonor-coin-2:      #f59e0b;
    --topdonor-coin-text:   #1a1207;
    --progress-bg:          rgba(255,255,255,0.06);
    --progress-1:           #7c3aed;
    --progress-2:           #a78bfa;
    --progress-3:           #f472b6;
    --progress-glow:        rgba(167,139,250,0.6);
    --font-family:          'Inter', system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); }
  html, body {
    background: transparent !important;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .ambient {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .ambient-spark {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--particle-2);
    box-shadow: 0 0 6px var(--particle-glow);
    opacity: 0;
    animation: ambientRise 6s linear infinite;
  }
  @keyframes ambientRise {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.8; }
    100% { transform: translateY(-400px) scale(0.3); opacity: 0; }
  }

  /* ── Cristal más grande ── */
  .crystal-stage {
    position: relative;
    width: 340px;
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .aura {
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle,
      var(--crystal-aura-1) 0%,
      var(--crystal-aura-2) 35%,
      transparent 70%);
    filter: blur(20px);
    animation: auraPulse 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes auraPulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50%      { transform: scale(1.15); opacity: 1; }
  }

  .crystal {
    position: relative;
    width: 280px;
    height: 330px;
    animation: float 7s ease-in-out infinite;
    filter: drop-shadow(0 0 var(--crystal-glow-size) var(--crystal-glow));
    transition: filter 0.6s ease;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-16px) rotate(1.5deg); }
  }

  .crystal svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /*
    Contenedor de partículas: alineado con el hexágono INTERIOR del SVG
    y recortado con clip-path para que nada se salga del cristal.
  */
  .particles {
    position: absolute;
    left: 25px;
    top: 13px;
    width: 229px;
    height: 305px;
    pointer-events: none;
    overflow: hidden;
    z-index: 2;
    clip-path: polygon(
      50% 0%,
      100% 21%,
      100% 79%,
      50% 100%,
      0% 79%,
      0% 21%
    );
    -webkit-clip-path: polygon(
      50% 0%,
      100% 21%,
      100% 79%,
      50% 100%,
      0% 79%,
      0% 21%
    );
  }

  .particle {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%,
      var(--particle-1),
      var(--particle-2),
      var(--particle-3));
    box-shadow:
      0 0 8px var(--particle-glow),
      0 0 16px var(--particle-glow);
    transition: background 0.5s ease, box-shadow 0.5s ease,
                opacity 0.6s ease, transform 0.6s ease;
    will-change: transform, opacity;
  }
  .particle.falling {
    opacity: 0;
  }
  .particle.gold {
    background: radial-gradient(circle at 30% 30%,
      var(--gold-1),
      var(--gold-2),
      var(--gold-3));
    box-shadow:
      0 0 10px var(--gold-glow),
      0 0 22px var(--gold-glow);
    animation: goldShine 1.8s ease-in-out infinite;
  }
  @keyframes goldShine {
    0%, 100% { box-shadow: 0 0 10px var(--gold-glow), 0 0 22px var(--gold-glow); }
    50%      { box-shadow: 0 0 18px var(--gold-glow), 0 0 40px var(--gold-glow); }
  }
  /* Iconos de regalo: 18x18, centrados en la celda de 20px */
  .particle.gift-icon {
    width: 18px;
    height: 18px;
    background-color: transparent;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    box-shadow: none;
    filter: drop-shadow(0 0 6px var(--crystal-glow));
  }

  /* Animación de "derretir" (fade out suave) */
  .particle.melting {
    opacity: 0 !important;
    transform: scale(0.5) !important;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  body.meta-reached .crystal {
    filter: drop-shadow(0 0 80px rgba(255,215,0,0.75));
  }
  body.meta-reached .aura {
    background: radial-gradient(circle,
      rgba(255,215,0,0.45) 0%,
      rgba(255,180,0,0.2) 40%,
      transparent 70%);
  }

  /* ── Info pegada al cristal ── */
  .info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-height: auto;
    margin-top: -16px;
    z-index: 3;
  }

  .label-row {
    font-size: 0.68em;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--label-color);
    opacity: 0.9;
    text-align: center;
    margin-bottom: 6px;
    text-shadow: 0 0 12px var(--label-glow);
  }

  .top-donor-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(-8px) scale(0.95);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .top-donor-wrap.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .top-donor {
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--topdonor-bg-1), var(--topdonor-bg-2));
    border: 1.5px solid var(--topdonor-border);
    border-radius: 100px;
    padding: 6px 18px 6px 6px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow:
      0 8px 24px rgba(0,0,0,0.4),
      0 0 24px var(--topdonor-glow),
      inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }
  .top-donor::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent);
    pointer-events: none;
  }
  .top-donor .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--crystal-stroke-2);
    background: #2a2a35;
    object-fit: cover;
    box-shadow: 0 0 12px var(--crystal-glow);
    position: relative;
    z-index: 1;
    flex-shrink: 0;
  }
  .top-donor .name {
    font-weight: 800;
    font-size: 0.95em;
    color: var(--text-primary);
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.3px;
    position: relative;
    z-index: 1;
  }

  .top-donor .gift-info {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px 3px 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 100px;
    position: relative;
    z-index: 1;
    flex-shrink: 0;
  }
  .top-donor .gift-icon-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    font-size: 18px;
    line-height: 1;
  }
  .top-donor .gift-icon-wrap img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    filter: drop-shadow(0 0 4px var(--crystal-glow));
  }
  .top-donor .gift-name {
    font-size: 0.78em;
    font-weight: 700;
    color: var(--text-primary);
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.2px;
  }
  .top-donor .gift-streak {
    font-size: 0.75em;
    font-weight: 900;
    color: var(--topdonor-coin-2);
    background: rgba(245,158,11,0.15);
    padding: 2px 7px;
    border-radius: 100px;
    letter-spacing: 0.3px;
    font-family: 'Menlo', 'Consolas', monospace;
    border: 1px solid rgba(245,158,11,0.3);
  }

  .top-donor .coins {
    background: linear-gradient(135deg, var(--topdonor-coin-1), var(--topdonor-coin-2));
    color: var(--topdonor-coin-text);
    padding: 5px 12px 5px 8px;
    border-radius: 100px;
    font-size: 0.82em;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow:
      0 2px 8px rgba(255,215,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.6);
    letter-spacing: 0.3px;
    position: relative;
    z-index: 1;
    flex-shrink: 0;
  }
  .top-donor .coins svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.3));
  }

  .meta-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .total {
    font-size: 1.55em;
    font-weight: 900;
    background: linear-gradient(135deg,
      var(--text-primary) 0%,
      var(--crystal-stroke-2) 50%,
      var(--crystal-stroke-1) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    filter: drop-shadow(0 2px 10px var(--crystal-glow));
    font-variant-numeric: tabular-nums;
  }
  .total .meta {
    color: var(--meta-color);
    -webkit-text-fill-color: var(--meta-color);
    font-size: 0.75em;
    opacity: 0.65;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .progress-wrap {
    width: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: -4px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .progress-wrap.show {
    opacity: 1;
    transform: translateY(0);
  }
  .progress-bar {
    position: relative;
    width: 100%;
    height: 10px;
    background: var(--progress-bg);
    border-radius: 100px;
    overflow: hidden;
    box-shadow:
      inset 0 1px 3px rgba(0,0,0,0.4),
      0 0 0 1px rgba(167,139,250,0.15);
  }
  .progress-fill {
    position: relative;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
      var(--progress-1),
      var(--progress-2),
      var(--progress-3));
    border-radius: 100px;
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 0 14px var(--progress-glow);
    overflow: hidden;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg,
      transparent,
      rgba(255,255,255,0.6),
      transparent);
    animation: progressShine 2.5s ease-in-out infinite;
  }
  @keyframes progressShine {
    0%   { left: -60%; }
    100% { left: 100%; }
  }
  .progress-text {
    font-size: 0.72em;
    font-weight: 800;
    color: var(--meta-color);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.85;
    text-shadow: 0 0 8px var(--label-glow);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div id="stage">

  <div class="ambient" id="ambient"></div>

  <div class="crystal-stage">
    <div class="aura"></div>

    <div class="crystal">
      <svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="crystalFill" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="var(--crystal-fill-top)" />
            <stop offset="100%" stop-color="var(--crystal-fill-bottom)" />
          </linearGradient>

          <linearGradient id="crystalStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="var(--crystal-stroke-1)" />
            <stop offset="50%"  stop-color="var(--crystal-stroke-2)" />
            <stop offset="100%" stop-color="var(--crystal-stroke-3)" />
          </linearGradient>

          <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.18)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
          </linearGradient>

          <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.12)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
          </linearGradient>

          <radialGradient id="core" cx="50%" cy="40%" r="50%">
            <stop offset="0%"   stop-color="var(--crystal-core-1)" stop-opacity="0.9" />
            <stop offset="40%"  stop-color="var(--crystal-core-2)" stop-opacity="0.4" />
            <stop offset="100%" stop-color="var(--crystal-core-3)" stop-opacity="0" />
          </radialGradient>
        </defs>

        <polygon points="110,10 200,60 200,200 110,250 20,200 20,60"
                 fill="url(#crystalFill)"
                 stroke="url(#crystalStrokeGrad)"
                 stroke-width="2.5"
                 stroke-linejoin="round" />

        <polygon points="110,10 20,60 20,200 110,250 110,10"
                 fill="url(#facetLeft)" />

        <polygon points="110,10 200,60 200,200 110,250 110,10"
                 fill="url(#facetRight)" />

        <ellipse cx="110" cy="130" rx="60" ry="90"
                 fill="url(#core)"
                 style="mix-blend-mode: screen;">
          <animate attributeName="opacity"
                   values="0.7;1;0.7"
                   dur="3s"
                   repeatCount="indefinite" />
        </ellipse>

        <line x1="110" y1="10" x2="110" y2="250"
              stroke="var(--crystal-edge)"
              stroke-width="1"
              opacity="0.6" />
        <line x1="20" y1="60"  x2="200" y2="200"
              stroke="var(--crystal-edge)"
              stroke-width="1"
              opacity="0.3" />
        <line x1="200" y1="60" x2="20"  y2="200"
              stroke="var(--crystal-edge)"
              stroke-width="1"
              opacity="0.3" />

        <path d="M 110,10 L 200,60"
              stroke="white"
              stroke-width="2.5"
              stroke-linecap="round"
              opacity="0.55" />
        <path d="M 20,60 L 110,10"
              stroke="white"
              stroke-width="2.5"
              stroke-linecap="round"
              opacity="0.35" />

        <circle r="3" fill="white" opacity="0.9">
          <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
            <mpath href="#crystalPath" />
          </animateMotion>
        </circle>

        <path id="crystalPath"
              d="M 110,10 L 200,60 L 200,200 L 110,250 L 20,200 L 20,60 Z"
              fill="none"
              stroke="none" />
      </svg>

      <div class="particles" id="particles"></div>
    </div>
  </div>

  <div class="info">
    <div class="top-donor-wrap" id="topDonorWrap">
      <div class="label-row" id="topDonorLabel">🏆 Top Donador</div>
      <div class="top-donor" id="topDonor">
        <img class="avatar" id="topAvatar" src="https://i.imgur.com/OmnpuQH.png" alt="">
        <span class="name" id="topName">—</span>
        <span class="gift-info" id="giftInfo" style="display:none;">
          <span class="gift-icon-wrap" id="giftIconWrap"></span>
          <span class="gift-name" id="giftName"></span>
          <span class="gift-streak" id="giftStreak" style="display:none;"></span>
        </span>
        <span class="coins">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <circle cx="12" cy="12" r="11" fill="#d97706"/>
            <circle cx="12" cy="12" r="9.5" fill="#fbbf24"/>
            <circle cx="12" cy="12" r="8" fill="none" stroke="#b45309" stroke-width="0.8"/>
            <text x="12" y="16.5" text-anchor="middle" font-size="11" font-weight="900" fill="#78350f" font-family="Arial, sans-serif">$</text>
          </svg>
          <span id="topCoins">0</span>
        </span>
      </div>
    </div>

    <div class="meta-wrap">
      <div class="label-row" id="metaLabel">🎯 Meta</div>
      <div class="total">
        <span id="totalCoins">0</span>
        <span class="meta">/ <span id="metaCoins">500</span> 💎</span>
      </div>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text"><span id="progressText">0%</span></div>
  </div>
</div>

<script src="/js/server-url.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
  const TOP_DONOR_DURATION = 5000;
  const MAX_PARTICLES = 60;

  const socket = io(window.SERVER_BASE);

  const particles     = document.getElementById('particles');
  const topDonorWrap  = document.getElementById('topDonorWrap');
  const topDonorLabel = document.getElementById('topDonorLabel');
  const topAvatar     = document.getElementById('topAvatar');
  const topName       = document.getElementById('topName');
  const topCoins      = document.getElementById('topCoins');
  const giftInfo      = document.getElementById('giftInfo');
  const giftIconWrap  = document.getElementById('giftIconWrap');
  const giftNameEl    = document.getElementById('giftName');
  const giftStreakEl  = document.getElementById('giftStreak');
  const totalCoins    = document.getElementById('totalCoins');
  const metaCoins     = document.getElementById('metaCoins');
  const metaLabel     = document.getElementById('metaLabel');
  const progressWrap  = document.getElementById('progressWrap');
  const progressFill  = document.getElementById('progressFill');
  const progressText  = document.getElementById('progressText');
  const ambient       = document.getElementById('ambient');

  let meta = 500;
  let totalDiamonds = 0;
  const userTotals = new Map();
  const userAvatars = new Map();
  const userLastGift = new Map();
  let topDonorTimer = null;
  let themeApplied = false;

  // ============================================================
  // SISTEMA DE PARTÍCULAS CON FÍSICA DE CAÍDA Y APILADO
  // ============================================================
  const COLS = 10;              // columnas lógicas dentro del frasco
  const COL_W = 20;             // ancho de columna en px (18 icono + 2 gap)
  const ROW_H = 14;             // alto de fila en px (12 normal + 2 gap)
  const MAX_ROWS = 18;          // filas máximas antes de derretir
  const PARTICLE_FLOOR_OFFSET = 12; // margen desde el vértice inferior
  const MAX_CAPACITY = COLS * MAX_ROWS; // 180 slots lógicos

  // stack[col] = cuántas partículas hay apiladas en esa columna
  const stack = new Array(COLS).fill(0);

  function pickColumnWithFewest() {
    let min = Infinity, candidates = [];
    for (let c = 0; c < COLS; c++) {
      if (stack[c] < min) { min = stack[c]; candidates = [c]; }
      else if (stack[c] === min) candidates.push(c);
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function particlePositionFor(col, row) {
    const x = col * COL_W + (COL_W - 12) / 2; // para 12px
    const y = (MAX_ROWS - 1 - row) * ROW_H + PARTICLE_FLOOR_OFFSET;
    return { x, y };
  }

  function particlePositionForGift(col, row) {
    const x = col * COL_W + (COL_W - 18) / 2;
    const y = (MAX_ROWS - 1 - row) * ROW_H + PARTICLE_FLOOR_OFFSET;
    return { x, y };
  }

  function colRowFromIndex(idx) {
    return { col: idx % COLS, row: Math.floor(idx / COLS) };
  }

  function meltOldestParticles(count) {
    const candidates = Array.from(particles.children).filter(el => !el.classList.contains('melting'));
    for (let i = 0; i < count && i < candidates.length; i++) {
      const el = candidates[i];
      el.classList.add('melting');
      setTimeout(() => el.remove(), 650);
    }
  }

  function updateStackFromDOM() {
    stack.fill(0);
    for (const el of particles.children) {
      if (el.classList.contains('melting')) continue;
      const col = parseInt(el.dataset.col, 10);
      if (!isNaN(col) && col >= 0 && col < COLS) stack[col]++;
    }
  }

  function addParticle(iconUrl, isGold = false) {
    const activeCount = Array.from(particles.children).filter(el => !el.classList.contains('melting')).length;
    if (activeCount >= MAX_CAPACITY) {
      meltOldestParticles(Math.ceil(activeCount * 0.15));
    }

    updateStackFromDOM();

    const col = pickColumnWithFewest();
    const row = stack[col];
    if (row >= MAX_ROWS) return;

    stack[col]++;

    const isGift = !!iconUrl;
    const p = document.createElement('div');
    p.className = 'particle' + (isGold ? ' gold' : '') + (isGift ? ' gift-icon' : '');
    if (isGift) p.style.backgroundImage = `url('${iconUrl}')`;

    const pos = isGift ? particlePositionForGift(col, row) : particlePositionFor(col, row);
    p.style.left = pos.x + 'px';
    p.style.top  = pos.y + 'px';
    p.dataset.col = col;
    p.dataset.row = row;

    p.style.transform = 'translateY(-400px)';
    p.style.opacity = '0';

    particles.appendChild(p);

    void p.offsetWidth;

    requestAnimationFrame(() => {
      p.style.transition = 'transform 0.7s cubic-bezier(0.34, 1.35, 0.64, 1), opacity 0.25s ease-out, background 0.5s ease, box-shadow 0.5s ease';
      p.style.transform = 'translateY(0)';
      p.style.opacity = '1';
    });
  }

  function reconstruirParticulas() {
    particles.innerHTML = '';
    stack.fill(0);

    const cantidad = Math.min(Math.floor(totalDiamonds / 15), MAX_PARTICLES);
    for (let i = 0; i < cantidad; i++) {
      const { col, row } = colRowFromIndex(i);
      if (col >= COLS) break;
      stack[col] = Math.max(stack[col], row + 1);

      const p = document.createElement('div');
      p.className = 'particle';
      if (Math.random() < 0.15) p.classList.add('gold');
      const pos = particlePositionFor(col, row);
      p.style.left = pos.x + 'px';
      p.style.top  = pos.y + 'px';
      p.dataset.col = col;
      p.dataset.row = row;
      particles.appendChild(p);
    }
  }

  // ============================================================
  // GIFT EMOJI FALLBACK
  // ============================================================
  const GIFT_EMOJI_FALLBACK = {
    'rosa': '🌹', 'rose': '🌹',
    'gg': '🎮',
    'corazon': '💖', 'corazón': '💖', 'heart': '💖', 'heart-me': '💖',
    'corona': '👑', 'crown': '👑',
    'coconut': '🥥', 'coco': '🥥', 'drink': '🥤',
    'cafe': '☕', 'café': '☕', 'coffee': '☕',
    'helado': '🍦', 'ice cream': '🍦',
    'cerveza': '🍺', 'beer': '🍺',
    'pizza': '🍕',
    'guitarra': '🎸', 'guitar': '🎸',
    'flor': '🌸', 'flower': '🌸',
    'perfume': '💐',
    'diamante': '💎', 'diamond': '💎',
    'galaxy': '🌌', 'galaxia': '🌌',
    'universo': '🌌', 'universe': '🌌',
    'planeta': '🪐', 'planet': '🪐',
    'dragon': '🐉', 'dragón': '🐉',
    'fuego': '🔥', 'fire': '🔥',
    'star': '⭐', 'estrella': '⭐',
    'train': '🚂', 'tren': '🚂',
    'cohete': '🚀', 'rocket': '🚀',
    'oso': '🧸', 'teddy': '🧸', 'bear': '🧸',
    'anillo': '💍', 'ring': '💍',
    'libro': '📕', 'book': '📕'
  };

  function getEmojiFallback(giftName) {
    if (!giftName) return '🎁';
    const key = String(giftName).toLowerCase().trim();
    if (GIFT_EMOJI_FALLBACK[key]) return GIFT_EMOJI_FALLBACK[key];
    for (const [k, v] of Object.entries(GIFT_EMOJI_FALLBACK)) {
      if (key.includes(k)) return v;
    }
    return '🎁';
  }

  function formatearNumero(n) {
    n = Number(n) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 10000)   return (n / 1000).toFixed(0) + 'K';
    if (n >= 1000)    return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  }

  function renderGiftIcon(giftName, giftImage, giftIcon) {
    const icon = giftImage || giftIcon;
    if (icon) {
      const emoji = getEmojiFallback(giftName);
      giftIconWrap.innerHTML = `<img src="${icon}" alt="" onerror="this.replaceWith(document.createTextNode('${emoji}'))">`;
    } else if (giftName) {
      giftIconWrap.textContent = getEmojiFallback(giftName);
    } else {
      giftIconWrap.textContent = '🎁';
    }
  }

  function crearChispaAmbiental() {
    const s = document.createElement('div');
    s.className = 'ambient-spark';
    s.style.left = Math.random() * 100 + '%';
    s.style.bottom = '-10px';
    s.style.animationDelay = Math.random() * 6 + 's';
    s.style.animationDuration = (4 + Math.random() * 4) + 's';
    ambient.appendChild(s);
    setTimeout(() => s.remove(), 10000);
  }
  for (let i = 0; i < 8; i++) setTimeout(crearChispaAmbiental, i * 400);
  setInterval(crearChispaAmbiental, 900);

  function aplicarTema(vars) {
    if (!vars || typeof vars !== 'object') return;
    for (const [k, v] of Object.entries(vars)) {
      if (typeof v !== 'string') continue;
      if (k === '--meta-label')           { metaLabel.textContent = v; continue; }
      if (k === '--topdonor-label')       { topDonorLabel.textContent = v; continue; }
      if (k === '--meta-label-visible')   { metaLabel.style.display = (v === 'false') ? 'none' : ''; continue; }
      if (k === '--topdonor-label-visible') { topDonorLabel.style.display = (v === 'false') ? 'none' : ''; continue; }
      if (k.startsWith('--')) {
        document.documentElement.style.setProperty(k, v);
      }
    }
    themeApplied = true;
  }

  async function cargarTema() {
    try {
      const r = await fetch(window.SERVER_BASE + '/api/themes/crystal');
      if (!r.ok) return;
      const vars = await r.json();
      if (vars && Object.keys(vars).length > 0) aplicarTema(vars);
    } catch (e) { console.warn('Sin tema:', e.message); }
  }

  async function cargarMeta() {
    try {
      const r = await fetch(window.SERVER_BASE + '/get-config');
      if (!r.ok) return;
      const config = await r.json();
      if (typeof config.JAR_META === 'number' && config.JAR_META >= 1) {
        meta = config.JAR_META;
      }
      metaCoins.textContent = formatearNumero(meta);
      updateUI();
    } catch (e) { console.warn('Sin meta:', e.message); }
  }

  async function cargarEstado() {
    try {
      const r = await fetch(window.SERVER_BASE + '/api/jar-state');
      if (!r.ok) return;
      const state = await r.json();

      totalDiamonds = state.totalDiamonds || 0;
      userTotals.clear();
      userAvatars.clear();
      userLastGift.clear();

      for (const [u, d] of Object.entries(state.userTotals || {})) userTotals.set(u, d);
      for (const [u, a] of Object.entries(state.userAvatars || {})) userAvatars.set(u, a);

      if (state.lastGift) {
        userLastGift.set(state.lastGift.username, {
          giftName: state.lastGift.giftName,
          giftImage: state.lastGift.giftImage,
          giftIcon: state.lastGift.giftIcon,
          repeatCount: state.lastGift.repeatCount
        });
      }

      reconstruirParticulas();
      updateUI();
      mostrarTopHistorico();
    } catch (e) { console.warn('Sin estado:', e.message); }
  }

  function showTopDonorTemporal({ username, avatar, diamonds, giftName, giftImage, giftIcon, repeatCount }) {
    topAvatar.src = avatar || 'https://i.imgur.com/OmnpuQH.png';
    topName.textContent = username;
    topCoins.textContent = formatearNumero(diamonds);

    if (giftName || giftImage || giftIcon) {
      renderGiftIcon(giftName, giftImage, giftIcon);
      giftNameEl.textContent = giftName || '';

      if (repeatCount && repeatCount > 1) {
        giftStreakEl.textContent = 'x' + repeatCount;
        giftStreakEl.style.display = '';
      } else {
        giftStreakEl.style.display = 'none';
      }

      giftInfo.style.display = 'flex';
    } else {
      giftInfo.style.display = 'none';
    }

    topDonorWrap.classList.add('show');

    clearTimeout(topDonorTimer);
    topDonorTimer = setTimeout(() => mostrarTopHistorico(), TOP_DONOR_DURATION);
  }

  function mostrarTopHistorico() {
    let topUser = null, topDiamonds = 0;
    for (const [u, d] of userTotals.entries()) {
      if (d > topDiamonds) { topDiamonds = d; topUser = u; }
    }
    if (topUser) {
      topAvatar.src = userAvatars.get(topUser) || 'https://i.imgur.com/OmnpuQH.png';
      topName.textContent = topUser;
      topCoins.textContent = formatearNumero(topDiamonds);

      const lastGift = userLastGift.get(topUser);
      if (lastGift) {
        renderGiftIcon(lastGift.giftName, lastGift.giftImage, lastGift.giftIcon);
        giftNameEl.textContent = lastGift.giftName || '';

        if (lastGift.repeatCount && lastGift.repeatCount > 1) {
          giftStreakEl.textContent = 'x' + lastGift.repeatCount;
          giftStreakEl.style.display = '';
        } else {
          giftStreakEl.style.display = 'none';
        }

        giftInfo.style.display = 'flex';
      } else {
        giftInfo.style.display = 'none';
      }

      topDonorWrap.classList.add('show');
    } else {
      topDonorWrap.classList.remove('show');
    }
  }

  function updateUI() {
    totalCoins.textContent = formatearNumero(totalDiamonds);
    metaCoins.textContent = formatearNumero(meta);

    const percent = Math.min((totalDiamonds / meta) * 100, 100);
    progressFill.style.width = percent + '%';
    progressText.textContent = Math.round(percent) + '%';
    progressWrap.classList.toggle('show', totalDiamonds > 0);
    document.body.classList.toggle('meta-reached', percent >= 100);
  }

  socket.on('jar-state', (state) => {
    totalDiamonds = state.totalDiamonds || 0;
    userTotals.clear();
    userAvatars.clear();
    userLastGift.clear();
    for (const [u, d] of Object.entries(state.userTotals || {})) userTotals.set(u, d);
    for (const [u, a] of Object.entries(state.userAvatars || {})) userAvatars.set(u, a);

    if (state.lastGift) {
      userLastGift.set(state.lastGift.username, {
        giftName: state.lastGift.giftName,
        giftImage: state.lastGift.giftImage,
        giftIcon: state.lastGift.giftIcon,
        repeatCount: state.lastGift.repeatCount
      });
    }

    reconstruirParticulas();
    updateUI();
    mostrarTopHistorico();
  });

  socket.on('jar-update', (data) => {
    totalDiamonds = data.totalDiamonds || 0;

    if (data.userTotals) {
      for (const [u, d] of Object.entries(data.userTotals)) userTotals.set(u, d);
    }

    const lastGift = data.lastGift;
    if (lastGift) {
      if (lastGift.avatar) userAvatars.set(lastGift.username, lastGift.avatar);

      userLastGift.set(lastGift.username, {
        giftName: lastGift.giftName,
        giftImage: lastGift.giftImage,
        giftIcon: lastGift.giftIcon,
        repeatCount: lastGift.repeatCount
      });

      const isGold = (lastGift.diamonds || 0) >= 50;
      const repeat = Math.min(lastGift.repeatCount || 1, 5);
      const icon = lastGift.giftImage || lastGift.giftIcon || null;

      for (let i = 0; i < repeat; i++) {
        setTimeout(() => addParticle(icon, isGold), i * 80);
      }

      showTopDonorTemporal({
        username: lastGift.username,
        avatar: lastGift.avatar,
        diamonds: userTotals.get(lastGift.username) || lastGift.diamonds,
        giftName: lastGift.giftName,
        giftImage: lastGift.giftImage,
        giftIcon: lastGift.giftIcon,
        repeatCount: lastGift.repeatCount
      });
    }
    updateUI();
  });

  socket.on('jar-reset', () => {
    particles.innerHTML = '';
    stack.fill(0);
    userTotals.clear();
    userAvatars.clear();
    userLastGift.clear();
    totalDiamonds = 0;
    topDonorWrap.classList.remove('show');
    clearTimeout(topDonorTimer);
    updateUI();
  });

  socket.on('jar-meta-updated', ({ meta: nuevaMeta }) => {
    if (typeof nuevaMeta === 'number' && nuevaMeta >= 1) {
      meta = nuevaMeta;
      updateUI();
    }
  });

  socket.on('theme-updated', ({ overlay, vars }) => {
    if (overlay !== 'crystal') return;
    if (!vars || Object.keys(vars).length === 0) {
      metaLabel.textContent = '🎯 Meta';
      topDonorLabel.textContent = '🏆 Top Donador';
      metaLabel.style.display = '';
      topDonorLabel.style.display = '';
    } else {
      aplicarTema(vars);
    }
  });

  socket.on('connect', () => {
    cargarTema();
    cargarMeta();
    cargarEstado();
  });

  setTimeout(() => {
    if (!themeApplied) cargarTema();
    cargarMeta();
    cargarEstado();
  }, 1000);

  const params = new URLSearchParams(location.search);
  if (params.get('preview') === '1') {
    const fakeUsers = ['Zerody', 'TestUser', 'Ana', 'Luis', 'Carla'];
    const fakeGifts = [
      { name: 'Rosa',          icon: '/img/gifts/rose.png',         diamonds: 1   },
      { name: 'GG',            icon: '/img/gifts/gg.png',           diamonds: 1   },
      { name: 'Corazón',       icon: '/img/gifts/heart-me.png',     diamonds: 5   },
      { name: 'Coconut Drink', icon: '/img/gifts/coconut-drink.png', diamonds: 1  },
      { name: 'Corona',        icon: '/img/gifts/crown.png',        diamonds: 100 }
    ];

    setInterval(() => {
      const user = fakeUsers[Math.floor(Math.random() * fakeUsers.length)];
      const gift = fakeGifts[Math.floor(Math.random() * fakeGifts.length)];
      const repeat = Math.floor(Math.random() * 3) + 1;
      const diamonds = gift.diamonds * repeat;

      totalDiamonds += diamonds;
      userTotals.set(user, (userTotals.get(user) || 0) + diamonds);
      const avatar = `https://i.pravatar.cc/150?u=${user}`;
      userAvatars.set(user, avatar);

      userLastGift.set(user, {
        giftName: gift.name,
        giftImage: gift.icon,
        giftIcon: gift.icon,
        repeatCount: repeat
      });

      const isGold = diamonds >= 50;
      for (let i = 0; i < Math.min(repeat, 5); i++) {
        setTimeout(() => addParticle(gift.icon, isGold), i * 80);
      }

      showTopDonorTemporal({
        username: user,
        avatar: avatar,
        diamonds: userTotals.get(user),
        giftName: gift.name,
        giftImage: gift.icon,
        giftIcon: gift.icon,
        repeatCount: repeat
      });
      updateUI();
    }, 2500);
  }
</script>
