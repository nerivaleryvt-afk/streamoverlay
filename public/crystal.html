<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crystal Overlay</title>
<link rel="stylesheet" href="/css/crystal.css">
</head>
<body>

<div id="stage" data-style="jar">

  <!-- ESTILO BARRA (horizontal) -->
  <div class="bar-stage">
    <div class="bar-wrap">

      <!-- TOP DONOR arriba de la barra -->
      <div class="bar-top-donor" id="barTopDonor">
        <div class="bar-avatar is-default" id="barAvatar">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
          </svg>
        </div>
        <span class="bar-name" id="barName">—</span>
        <span class="bar-coins">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <circle cx="12" cy="12" r="11" fill="#d9a441"/>
            <circle cx="12" cy="12" r="9.5" fill="#f5d97a"/>
            <circle cx="12" cy="12" r="8" fill="none" stroke="#a67a2a" stroke-width="0.8"/>
            <text x="12" y="16.5" text-anchor="middle" font-size="11" font-weight="900" fill="#3a2a08" font-family="Arial, sans-serif">$</text>
          </svg>
          <span id="barCoins">0</span>
        </span>
      </div>

      <!-- RIEL + RELLENO -->
      <div class="bar-track">
        <div class="bar-fill"></div>
      </div>

      <!-- META + % abajo -->
      <div class="bar-meta">
        <span id="barTotal">0</span>
        <span class="bar-sep">/</span>
        <span id="barMeta">500</span>
        <span class="bar-percent" id="barPercent">0%</span>
      </div>

    </div>
  </div>

  <div class="ambient" id="ambient"></div>

  <!-- ESTILO FRASCO (cristal) -->
  <div class="crystal-stage">
    <div class="crystal">
      <svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="crystalFill" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="rgba(232,130,90,0.18)" />
            <stop offset="100%" stop-color="rgba(232,130,90,0.04)" />
          </linearGradient>

          <linearGradient id="crystalStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#f0a184" />
            <stop offset="50%"  stop-color="#e8825a" />
            <stop offset="100%" stop-color="#b8623f" />
          </linearGradient>

          <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.14)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
          </linearGradient>

          <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.08)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
          </linearGradient>

          <radialGradient id="core" cx="50%" cy="40%" r="50%">
            <stop offset="0%"   stop-color="#f0a184" stop-opacity="0.55" />
            <stop offset="40%"  stop-color="#e8825a" stop-opacity="0.22" />
            <stop offset="100%" stop-color="#e8825a" stop-opacity="0" />
          </radialGradient>
        </defs>

        <polygon points="110,10 200,60 200,200 110,250 20,200 20,60"
                 fill="url(#crystalFill)"
                 stroke="url(#crystalStrokeGrad)"
                 stroke-width="2.5"
                 stroke-linejoin="round" />

        <polygon points="110,10 20,60 20,200 110,250 110,10"
                 fill="url(#facetLeft)" />

        <polygon points="110,10 200,60 200,200 110,250 110,10"
                 fill="url(#facetRight)" />

        <ellipse cx="110" cy="130" rx="60" ry="90"
                 fill="url(#core)"
                 style="mix-blend-mode: screen;">
          <animate attributeName="opacity"
                   values="0.7;1;0.7"
                   dur="3s"
                   repeatCount="indefinite" />
        </ellipse>

        <line x1="110" y1="10" x2="110" y2="250"
              stroke="var(--crystal-edge)"
              stroke-width="1"
              opacity="0.6" />
        <line x1="20" y1="60"  x2="200" y2="200"
              stroke="var(--crystal-edge)"
              stroke-width="1"
              opacity="0.3" />
        <line x1="200" y1="60" x2="20"  y2="200"
              stroke="var(--crystal-edge)"
              stroke-width="1"
              opacity="0.3" />

        <path d="M 110,10 L 200,60"
              stroke="white"
              stroke-width="2.5"
              stroke-linecap="round"
              opacity="0.45" />
        <path d="M 20,60 L 110,10"
              stroke="white"
              stroke-width="2.5"
              stroke-linecap="round"
              opacity="0.28" />

        <circle r="3" fill="white" opacity="0.9">
          <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
            <mpath href="#crystalPath" />
          </animateMotion>
        </circle>

        <path id="crystalPath"
              d="M 110,10 L 200,60 L 200,200 L 110,250 L 20,200 L 20,60 Z"
              fill="none"
              stroke="none" />
      </svg>

      <div class="particles" id="particles"></div>
    </div>
  </div>

  <!-- INFO (top donor + meta) — solo modo frasco -->
  <div class="info">
    <div class="top-donor-wrap" id="topDonorWrap">
      <div class="label-row" id="topDonorLabel">Top Donador</div>
      <div class="top-donor" id="topDonor">
        <div class="avatar is-default" id="topAvatar">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
          </svg>
        </div>
        <span class="name" id="topName">—</span>
        <span class="gift-info" id="giftInfo" style="display:none;">
          <span class="gift-icon-wrap" id="giftIconWrap"></span>
          <span class="gift-name" id="giftName"></span>
          <span class="gift-streak" id="giftStreak" style="display:none;"></span>
        </span>
        <span class="coins">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <circle cx="12" cy="12" r="11" fill="#d9a441"/>
            <circle cx="12" cy="12" r="9.5" fill="#f5d97a"/>
            <circle cx="12" cy="12" r="8" fill="none" stroke="#a67a2a" stroke-width="0.8"/>
            <text x="12" y="16.5" text-anchor="middle" font-size="11" font-weight="900" fill="#3a2a08" font-family="Arial, sans-serif">$</text>
          </svg>
          <span id="topCoins">0</span>
        </span>
      </div>
    </div>

    <div class="meta-wrap">
      <div class="label-row" id="metaLabel">Meta</div>
      <div class="total">
        <span id="totalCoins">0</span>
        <span class="meta">/ <span id="metaCoins">500</span></span>
      </div>
    </div>
  </div>

  <!-- BARRA DE PROGRESO (frasco) -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text"><span id="progressText">0%</span></div>
  </div>
</div>

<script src="/js/server-url.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/crystal.js"></script>
</body>
</html>
