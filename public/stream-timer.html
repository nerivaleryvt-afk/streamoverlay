<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Timer</title>

  <!-- Fuentes: Satoshi (UI) + JetBrains Mono (números) -->
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- CSS del timer -->
  <link rel="stylesheet" href="css/stream-timer.css" />
</head>
<body>

  <div id="stage" class="timer-stage">

    <div class="timer-pill" id="timerPill">

      <!-- Número grande (izquierda) -->
      <div class="timer-display" id="timerDisplay">00:00:00</div>

      <!-- Columna derecha -->
      <div class="timer-right">

        <div class="timer-status" id="timerStatus">EN PAUSA</div>

        <div class="timer-added" id="timerAdded">EL CHAT SUMÓ +0m</div>

      </div>

    </div>

  </div>

  <!-- Socket.io (para hablar con el server) -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- JS del timer -->
  <script src="js/stream-timer.js"></script>

</body>
</html>
